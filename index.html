<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Agenda de Estudos</title>
<meta name="theme-color" content="#3B2416">
<script>/* tema escuro antes de pintar (escolha guardada neste aparelho) */
try { var t = localStorage.getItem('agenda-tema'); if (t === 'escuro' || (t === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches)) { document.documentElement.dataset.tema = 'escuro'; document.querySelector('meta[name="theme-color"]').content = '#2A1C13'; } } catch (e) {}
</script>
<meta name="description" content="Agenda e controle de estudos.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icones/icone.svg" type="image/svg+xml">
<link rel="icon" href="icones/icone-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="icones/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Estudos">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<link rel="stylesheet" href="vendor/toastui/toastui-editor.min.css">
<link rel="stylesheet" href="css/estilos.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
</head>
<body>

<section id="tela-login" hidden>
  <div class="login-palco">
    <div class="login-marca">
      <img class="login-icone" src="icones/icone.svg" alt="" width="56" height="56">
      <h1>Agenda de Estudos</h1>
      <p class="login-dia" id="login-dia"></p>
      <ol class="login-semana" id="login-semana" aria-hidden="true"></ol>
    </div>
    <form class="login-form" id="login-form" novalidate>
      <h2>Acesse sua agenda</h2>
      <label class="campo"><span>E-mail</span><input id="login-email" type="email" autocomplete="username" inputmode="email" autocapitalize="off" spellcheck="false" placeholder="voce@email.com"></label>
      <label class="campo"><span>Senha</span>
        <span class="campo-senha"><input id="login-senha" type="password" autocomplete="current-password"><button type="button" class="ver-senha" id="login-ver-senha" aria-pressed="false">Mostrar</button></span>
      </label>
      <div class="erro" id="login-erro" role="alert"></div>
      <button class="btn btn-principal" id="login-entrar" type="submit">Entrar</button>
    </form>
  </div>
</section>

<div id="app" hidden>
  <header id="cabecalho">
    <button class="btn-icone" id="menu-botao" aria-label="Abrir menu" aria-expanded="false" aria-controls="menu"><i class="ti ti-menu-2" aria-hidden="true"></i></button>
    <span id="cabecalho-titulo">Agenda</span>
    <nav id="menu" aria-label="Telas" hidden>
      <button data-tela="agenda"><i class="ti ti-calendar-week" aria-hidden="true"></i>Agenda</button>
      <button data-tela="quadro"><i class="ti ti-layout-kanban" aria-hidden="true"></i>Quadro</button>
      <button data-tela="busca"><i class="ti ti-search" aria-hidden="true"></i>Busca</button>
      <button data-tela="tags"><i class="ti ti-tags" aria-hidden="true"></i>Tags</button>
      <button data-tela="dashboards"><i class="ti ti-chart-bar" aria-hidden="true"></i>Dashboards</button>
      <button data-tela="flashcards"><i class="ti ti-cards" aria-hidden="true"></i>Flashcards<span class="menu-contador" id="menu-flash-contador" hidden></span></button>
      <button data-tela="ajustes"><i class="ti ti-settings" aria-hidden="true"></i>Configurações</button>
      <button id="menu-sair"><i class="ti ti-logout" aria-hidden="true"></i>Sair</button>
    </nav>
  </header>
  <main>
    <section id="tela-hoje" hidden></section>
    <section id="tela-semana" hidden></section>
    <section id="tela-quadro" hidden></section>
    <section id="tela-busca" hidden></section>
    <section id="tela-tags" hidden></section>
    <section id="tela-dashboards" hidden></section>
    <section id="tela-flashcards" hidden></section>
    <section id="tela-flash-sessao" hidden></section>
    <section id="tela-ajustes" hidden></section>
  </main>
</div>

<!-- Editor visual: se não carregar, as anotações abrem numa caixa de texto simples (js/editor.js). -->
<script defer src="vendor/toastui/toastui-editor-all.min.js"></script>
<script defer src="vendor/toastui/pt-br.js"></script>
<script type="module" src="js/main.js"></script>
</body>
</html>
